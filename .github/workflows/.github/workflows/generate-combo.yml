name: Generate draft combo

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate data
        run: npm run validate:data

      - name: Generate draft combo
        run: npm run generate:combo

      - name: Upload draft artifact for manual review
        uses: actions/upload-artifact@v4
        with:
          name: draft-combo
          path: data/generated/draft-combo.json
